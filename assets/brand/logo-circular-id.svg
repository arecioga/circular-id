<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Logotipo de Circular ID</title>
  <desc id="desc">Símbolo circular de verificación y nombre Circular ID con el eslogan Cada prenda, una prueba de confianza.</desc>
  <g transform="translate(10 10)">
    <circle cx="80" cy="80" r="50" fill="none" stroke="#2EE6A6" stroke-width="14" stroke-linecap="round" stroke-dasharray="246 68" transform="rotate(-41 80 80)"/>
    <path d="M48 80.5 68 99 105 57" fill="none" stroke="#0C1B33" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="116" y="49" width="9" height="9" rx="2" fill="#2B7FFF"/>
    <rect x="128" y="63" width="7" height="7" rx="1.5" fill="#2B7FFF"/>
    <rect x="118" y="77" width="9" height="9" rx="2" fill="#2B7FFF"/>
  </g>
  <text x="190" y="92" fill="#0C1B33" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">CIRCULAR</text>
  <text x="512" y="92" fill="#18B980" font-family="Manrope, Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">ID</text>
  <text x="194" y="132" fill="#526176" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="500" letter-spacing="0.2">Cada prenda, una prueba de confianza.</text>
